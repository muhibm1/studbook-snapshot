# Two jobs, deliberately different in what they may touch.
#
# `checks` runs on every push and pull request with NO database or API credentials: lint, the
# unit suite, and a dependency audit. The suite's live tests skip without credentials, so this job
# asserts the count it actually ran instead of trusting a green result, and says plainly that the
# live tests were not part of it.
#
# `live` runs the whole suite, row-level-security tests included, and runs only when dispatched by
# hand. It reads STUDBOOK_TEST_* secrets and nothing else -- there is deliberately no fallback to
# the production connection strings, because the RLS suite writes probe rows and must point at a
# dedicated test project (see docs/ci.md). With the secrets missing it fails, naming them; it
# never skips its way to green.

name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live:
        description: "Also run the live suite against the STUDBOOK_TEST_* project"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install
        run: |
          pip install -r requirements.txt --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
          pip install -r requirements-dev.txt
      # test_rerank loads the real cross-encoder; cache the download rather than fetching ~1 GB per run.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ hashFiles('retrieve/rerank.py', 'ingest/embed.py') }}
      - name: Lint (pyflakes rules and syntax errors)
        run: ruff check --select F,E9 .
      - name: Gold set quotes are verbatim in their sources
        # Needs the corpus repositories' working trees, which no CI job has; it runs locally before
        # any gold-set change (docs/ci.md). Listed here so its absence is visible, not forgotten.
        run: 'echo "not run in CI -- eval/gold.py check needs the corpus working trees (docs/ci.md)"'
      - name: Unit tests (no credentials)
        run: |
          python -m unittest discover -s tests -v 2> unittest.log || { tail -40 unittest.log; exit 1; }
          tail -3 unittest.log
          ran=$(grep -oP '^Ran \K[0-9]+' unittest.log)
          skipped=$(grep -oP 'skipped=\K[0-9]+' unittest.log || echo 0)
          echo "ran $ran, skipped $skipped (live tests need credentials; they run in the live job)"
          # A green run that executed nothing is not a pass.
          test "$((ran - skipped))" -ge 150
      - name: Dependency audit
        # Eight torch advisories are accepted by id, each with its reason, in docs/ci.md: torch 2.9+
        # does not load on the development machine (requirements.txt). A new advisory, or any in
        # another package, still fails this step. Review the list whenever torch is bumped.
        run: >
          pip-audit -r requirements.txt
          --ignore-vuln PYSEC-2025-203 --ignore-vuln PYSEC-2025-204 --ignore-vuln PYSEC-2025-206
          --ignore-vuln PYSEC-2025-193 --ignore-vuln PYSEC-2025-194 --ignore-vuln PYSEC-2025-195
          --ignore-vuln PYSEC-2026-139 --ignore-vuln PYSEC-2026-2286

  live:
    if: github.event_name == 'workflow_dispatch' && inputs.live
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      STUDBOOK_DATABASE_URL: ${{ secrets.STUDBOOK_TEST_DATABASE_URL }}
      STUDBOOK_INGEST_DATABASE_URL: ${{ secrets.STUDBOOK_TEST_INGEST_DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.STUDBOOK_TEST_ANTHROPIC_API_KEY }}
    steps:
      - name: Require the test project's secrets
        run: |
          missing=""
          [ -n "$STUDBOOK_DATABASE_URL" ] || missing="$missing STUDBOOK_TEST_DATABASE_URL"
          [ -n "$STUDBOOK_INGEST_DATABASE_URL" ] || missing="$missing STUDBOOK_TEST_INGEST_DATABASE_URL"
          [ -n "$ANTHROPIC_API_KEY" ] || missing="$missing STUDBOOK_TEST_ANTHROPIC_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Set them under Settings > Secrets and variables > Actions, pointing at a dedicated test Supabase project, never production (docs/ci.md)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: pip install -r requirements.txt --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ hashFiles('retrieve/rerank.py', 'ingest/embed.py') }}
      - name: Full suite, nothing skipped
        run: |
          python -m unittest discover -s tests -v 2> unittest.log || { tail -40 unittest.log; exit 1; }
          tail -3 unittest.log
          if grep -q 'skipped=' unittest.log; then
            echo "::error::The live suite skipped tests; every test must run here."
            grep -i 'skipped' unittest.log | head -20
            exit 1
          fi
